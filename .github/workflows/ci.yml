name: CI

on:
  push:
    branches: [main]   # каждый push в main
  pull_request:        # и каждый Pull Request

jobs:
  test:
    runs-on: ubuntu-latest

    # Рядом с тестами GitHub запустит чистый PostgreSQL в контейнере
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agromarket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Переменные окружения вместо .env.test (значения только для CI)
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agromarket_test
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_EXPIRES_IN: 2h
      ADMIN_EMAIL: admin@test.kz
      ADMIN_PASSWORD: Admin12345
      CORS_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test